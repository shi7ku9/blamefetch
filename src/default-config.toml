# blamefetch default configuration.
# Copy to ~/.config/blamefetch/config.toml to customize.
# Every [[co_authors]] entry is one trailer line, rendered in array order.
#   kind   (optional) = built-in source (os, kernel, ...); omit for a config-only entry.
#   name/email/fields value = a plain string, or a shell command:
#     version = { command = "sh -c command", fallback = "used if the command fails" }
#   blank_line_before = true inserts a blank line before this trailer.
# blamefetch credits the machine by default and attributes no one else; anything
# else it prints is your configuration.

[commit]
# Fallback author used only when no real repo commit is picked (outside a git
# repository, or with --no-git). Inside a repo, the picked commit's own author
# is shown; use --author/--email to force.
# author_name = "Your Name"
# author_email = "you@example.com"

[messages]
pool = [
    "feat: pretend the hardware helped",
    "fix: blame the cache",
    "chore: credit where credit is due",
    "perf: co-authorship is a bottleneck",
    "docs: add everyone to CONTRIBUTORS",
    "refactor: delete a co-author",
    "test: assert the hardware was here",
]

[[co_authors]]
kind = "os"
enabled = true
name = "{name} {version}"
email = "os@system.invalid"

[[co_authors]]
kind = "kernel"
enabled = true
name = "{name} {release}"
email = "kernel@system.invalid"

[[co_authors]]
kind = "host"
enabled = true
name = "{product}"
email = "host@system.invalid"

[[co_authors]]
kind = "hostname"
enabled = true
name = "{hostname}"
email = "{hostname}@host.local"

[[co_authors]]
kind = "user"
enabled = true
name = "{user}"
email = "{user}@users.local"

[[co_authors]]
kind = "shell"
enabled = true
name = "{name} {version}"
email = "shell@system.invalid"

[[co_authors]]
kind = "terminal"
enabled = true
name = "{name}"
email = "terminal@system.invalid"

[[co_authors]]
kind = "wm"
enabled = true
name = "{name}"
email = "wm@system.invalid"

[[co_authors]]
kind = "uptime"
enabled = true
name = "{duration}"
email = "uptime@system.invalid"

[[co_authors]]
kind = "cpu"
enabled = true
name = "{model} ({cores} threads) @ {freq}"
email = "cpu@system.invalid"

[[co_authors]]
kind = "gpu"
enabled = true
name = "{name}"
email = "gpu@system.invalid"

[[co_authors]]
kind = "memory"
enabled = true
name = "{used} / {total}"
email = "memory@system.invalid"

[[co_authors]]
kind = "disk"
enabled = true
name = "{used} / {total}"
email = "disk@system.invalid"

[[co_authors]]
kind = "locale"
enabled = true
name = "{locale}"
email = "locale@system.invalid"
